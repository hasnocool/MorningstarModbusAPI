# MorningstarModbusAPI example configuration

[database]
path = "./morningstar.db"

[watch]
poll_interval_seconds = 5.0
discovery_interval_seconds = 30.0
request_timeout_seconds = 1.5
unit_ids = [1]
max_tcp_concurrency = 32
# Number of consecutive poll failures before a device is treated as offline.
failure_threshold = 3
# Failed/offline devices retry with exponential backoff between these bounds.
retry_backoff_initial_seconds = 2.0
retry_backoff_max_seconds = 60.0

[serial]
enabled = true
baudrate = 9600
stop_bits = 2
# Optional allowlist. Leave empty to inspect all enumerated serial devices.
ports = []

[tcp]
enabled = true
port = 502
# Explicit hosts are safest and are checked every discovery cycle.
hosts = []
# Optional local CIDRs. Example: ["192.168.1.0/24"]
# Networks larger than /20 are rejected to prevent accidental broad scanning.
subnets = []

[backfill]
# TS-MPPT-60/45 Ethernet controllers expose retained daily history through
# their built-in LiveView datalog page. Backfill runs after live polling succeeds
# so a slow or unavailable web page never delays normal telemetry acquisition.
enabled = true
on_startup = true
on_reconnect = true
max_days = 200
# Use an IANA zone such as "America/Vancouver" when exact DST-aware day boundaries matter.
calendar_timezone = "local"
http_port = 80
http_path = "/datalog.html"
timeout_seconds = 3.0
max_response_bytes = 1048576

[api]
host = "127.0.0.1"
port = 8080
