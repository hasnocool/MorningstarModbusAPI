name: ReadyEdge source hash probe

on:
  push:
    branches:
      - agent/component-graph-energy-ledger

permissions:
  contents: read

jobs:
  hash-source:
    runs-on: ubuntu-latest
    steps:
      - name: Hash official ReadyEdge MODBUS V01 PDF
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          url = (
              "https://www.morningstarcorp.com/wp-content/uploads/"
              "technical-doc-readyedge-modbus-specification-en.pdf"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                      "Chrome/151.0 Safari/537.36"
                  ),
                  "Accept": "application/pdf,*/*;q=0.8",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
          print(f"READYEDGE_BYTES={len(payload)}")
          print(f"READYEDGE_SHA256={hashlib.sha256(payload).hexdigest()}")
          PY
