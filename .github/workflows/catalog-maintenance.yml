name: Catalog maintenance

on:
  pull_request:
    paths:
      - "src/morningstar_modbus/catalog/**"
      - "docs/vendor/morningstar/sources.json"
      - "src/morningstar_modbus/maintenance/**"
      - "catalog-proposals/**"
      - "tests/test_catalog_maintenance.py"
      - ".github/workflows/catalog-maintenance.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Hash reviewed GenStar source
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          url = (
              "https://www.morningstarcorp.com/wp-content/uploads/"
              "technical-doc-genstar-mppt-modbus-specification-en.pdf"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                      "Chrome/151.0 Safari/537.36"
                  ),
                  "Accept": "application/pdf,*/*;q=0.8",
                  "Referer": "https://www.morningstarcorp.com/",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read()
          print(f"GENSTAR_SOURCE_SHA256={hashlib.sha256(payload).hexdigest()}")
          PY
      - name: Validate catalog and review provenance
        if: github.event_name == 'pull_request'
        run: >-
          python -m morningstar_modbus.maintenance validate
          --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate catalog
        if: github.event_name != 'pull_request'
        run: python -m morningstar_modbus.maintenance validate
      - run: pytest -q tests/test_catalog.py tests/test_catalog_maintenance.py

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[maintenance]'
      - name: Scan official Morningstar catalog sources
        run: python -m morningstar_modbus.maintenance scan --output-dir catalog-maintenance-report
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f catalog-maintenance-report/report.md ]; then
            cat catalog-maintenance-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morningstar-catalog-maintenance-report
          path: catalog-maintenance-report/
          if-no-files-found: warn
