name: Publish Release

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must be release/vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          if [[ "$tag" != "v${package_version}" ]]; then
            echo "Tag $tag does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "MorningstarModbusAPI $tag" \
            --generate-notes
